# Tilbudsagent – konfiguration
# Alle afstande er EN VEJ i km (opgivet af brugeren). Kørsel regnes tur/retur.

[koersel]
kr_pr_km = 2.0          # kørselsomkostning pr. km
stop_kr = 5.0           # lille "friktionspris" pr. butik der besøges (tid/besvær)
margin_pr_tur_kr = 0.0  # ekstra margen en tur til en ikke-sunk zone skal tjene ind
# Zoner du alligevel kører til hver uge: kørsel tæller 0 kr dér.
# ANTAGET: alle butikker i "lokal" ligger i samme by, og du handler dér ugentligt.
# Sæt til [] hvis kørslen også skal tælle med til de nære butikker.
sunk_zoner = ["lokal"]

[tjek]
# Tjeks offentlige tilbuds-API. Endpointet er udokumenteret og kan ændre sig – se README.
url = "https://squid-api.tjek.com/v2/offers/search"
api_key = ""            # tom = ingen nøgle sendes (nogle kilder nævner at en nøgle kan kræves)
lat = 0.0               # SÆT til din hjemmeadresse (0 = ingen stedsfilter)
lng = 0.0
radius_m = 30000
limit = 100
pause_sek = 1.5         # pause mellem kald – vær venlig ved API'et

[regler]
min_rabat = 0.15        # et tilbud skal være mindst 15 % under normalpris for at tælle
lager_rabat = 0.30      # ...og mindst 30 % under + nær bundpris for at udløse lagerkøb
max_rabat = 0.60        # rabatter over 60 % regnes for urealistiske (forkert pakkestørrelse) og bruges ikke
top_rabat = 0.40        # ekstra godt tilbud («topkøb»): mindst 40 % under normalpris (eller under målpris / nær laveste pris)
historik_dage = 180     # hvor langt tilbage historikken ser (normalpris, bundpris)

# --- Butikker -------------------------------------------------------------
# zone: butikker i samme zone antages at ligge i samme by/retning.
# En tur til en zone koster 2 x kr_pr_km x den fjerneste valgte butik i zonen.
# tjek_navn: navne som forhandleren hedder hos Tjek (små bogstaver, skal matche helt).

[butikker.netto]
navn = "Netto"
tjek_navn = ["netto"]
afstand_km = 6.6
zone = "lokal"

