name: Byg og udgiv

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Udgiv som release med dette versions-tag (fx v0.7.0). Tom = kun byg og gem filerne som artifacts."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer PyInstaller
        run: pip install pyinstaller==6.11.1

      - name: Byg Tilbudsagent.exe
        run: >
          pyinstaller --noconfirm --onefile --noconsole --name Tilbudsagent
          --hidden-import webapp --hidden-import steder
          --add-data "app.html;." --add-data "config.toml;." --add-data "varer.csv;."
          tilbudsagent.py

      - name: Røgtest (start exe, kald API, afslut)
        shell: pwsh
        run: |
          $env:TILBUDSAGENT_DATA = Join-Path $env:RUNNER_TEMP "tadata"
          $p = Start-Process -FilePath "dist\Tilbudsagent.exe" -ArgumentList "--port","8799","--ingen-browser" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-RestMethod "http://localhost:8799/api/ping"; if ($r.app -eq "tilbudsagent") { $ok = $true; break } } catch {}
          }
          if (-not $ok) { throw "Appen svarede ikke inden 40 sekunder." }
          $s = Invoke-RestMethod "http://localhost:8799/api/state"
          if ($s.varer.Count -lt 1 -or -not $s.cfg.butikker) { throw "Startdata mangler i pakken." }
          $html = Invoke-WebRequest "http://localhost:8799/" -UseBasicParsing
          if ($html.Content -notmatch "Tilbudsagent") { throw "app.html mangler i pakken." }
          Write-Host "OK: version $($r.version), $($s.varer.Count) varer, $(@($s.cfg.butikker.PSObject.Properties).Count) butikker"
          Invoke-RestMethod -Method Post -Uri "http://localhost:8799/api/afslut" -ContentType "application/json" -Body "{}" | Out-Null
          if (-not $p.WaitForExit(15000)) { $p.Kill(); throw "Appen lukkede ikke ved Afslut." }

      - name: Tjeksum
        shell: pwsh
        run: (Get-FileHash dist\Tilbudsagent.exe -Algorithm SHA256).Hash.ToLower() + "  Tilbudsagent.exe" | Out-File -Encoding ascii dist\Tilbudsagent.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Tilbudsagent-windows
          path: dist/Tilbudsagent.exe*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5   # Chaquopy bruger en pc-Python under bygningen
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Android SDK (licenser og platform)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Signeringsnøgle
        id: nogle
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tilbudsagent.jks"
            echo "fil=$RUNNER_TEMP/tilbudsagent.jks" >> "$GITHUB_OUTPUT"
            echo "udgivelse=ja" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::KEYSTORE_BASE64 mangler. APK'en signeres med en midlertidig nøgle og kan IKKE opdatere en udgivet version."
            echo "udgivelse=nej" >> "$GITHUB_OUTPUT"
          fi

      - name: Byg APK
        env:
          KEYSTORE_FIL: ${{ steps.nogle.outputs.fil }}
          KEYSTORE_KODE: ${{ secrets.KEYSTORE_KODE }}
          NOEGLE_ALIAS: tilbudsagent
        run: |
          gradle -p android assembleRelease -PversionCode=${{ github.run_number }} --no-daemon
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Tilbudsagent.apk

      - name: Kontrollér APK
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/aapt" dump badging dist/Tilbudsagent.apk | grep -E "^package|sdkVersion|native-code"
          "$BT/apksigner" verify --print-certs dist/Tilbudsagent.apk | grep -E "SHA-256|Verified" || true
          ls -l dist/Tilbudsagent.apk
          (cd dist && sha256sum Tilbudsagent.apk > Tilbudsagent.apk.sha256)

      - name: Slå KVM til (emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Røgtest på Android-emulator (start appen og kald serveren)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/scripts/android-roegtest.sh dist/Tilbudsagent.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Tilbudsagent-android
          path: dist/Tilbudsagent.apk*

  udgiv:
    needs: [windows, android]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: filer
          merge-multiple: true
      - name: Udgiv release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          ls -l filer
          gh release create "$VERSION" filer/* --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Tilbudsagent $VERSION" --generate-notes
